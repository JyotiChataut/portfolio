<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="blogTitle blogDesc">
  <title id="blogTitle">Blog — Van Gogh inspired reading room</title>
  <desc id="blogDesc">A Van Gogh style cozy interior with a writing desk, books, and warm lamplight, inspired by Bedroom in Arles.</desc>

  <defs>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#F4D03F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F4D03F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Back wall -->
  <rect width="1200" height="800" fill="#4A148C"/>

  <!-- Wall brushstrokes -->
  <g stroke-linecap="round" fill="none" opacity="0.12">
    <path d="M0 40 C200 20 400 50 600 30 C800 10 1000 40 1200 20" stroke="#6A1B9A" stroke-width="6" stroke-dasharray="12 6"/>
    <path d="M0 80 C200 60 400 90 600 70 C800 50 1000 80 1200 60" stroke="#6A1B9A" stroke-width="5" stroke-dasharray="10 5"/>
    <path d="M0 120 C200 100 400 130 600 110 C800 90 1000 120 1200 100" stroke="#4A148C" stroke-width="4" stroke-dasharray="8 5"/>
    <path d="M0 160 C200 140 400 170 600 150 C800 130 1000 160 1200 140" stroke="#6A1B9A" stroke-width="5" stroke-dasharray="10 6"/>
    <path d="M0 200 C200 180 400 210 600 190 C800 170 1000 200 1200 180" stroke="#4A148C" stroke-width="4" stroke-dasharray="8 5"/>
    <path d="M0 240 C200 220 400 250 600 230 C800 210 1000 240 1200 220" stroke="#6A1B9A" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M0 280 C200 260 400 290 600 270 C800 250 1000 280 1200 260" stroke="#4A148C" stroke-width="4" stroke-dasharray="9 5"/>
  </g>

  <!-- Floor -->
  <path d="M0 500 L1200 500 L1200 800 L0 800 Z" fill="url(#floorGrad)"/>

  <!-- Floor planks -->
  <g stroke-linecap="round" fill="none" opacity="0.2">
    <path d="M0 530 L1200 530" stroke="#3E2723" stroke-width="3" stroke-dasharray="15 5"/>
    <path d="M0 570 L1200 570" stroke="#3E2723" stroke-width="3" stroke-dasharray="15 5"/>
    <path d="M0 610 L1200 610" stroke="#3E2723" stroke-width="3" stroke-dasharray="15 5"/>
    <path d="M0 650 L1200 650" stroke="#3E2723" stroke-width="3" stroke-dasharray="15 5"/>
    <path d="M0 690 L1200 690" stroke="#3E2723" stroke-width="3" stroke-dasharray="15 5"/>
    <path d="M0 730 L1200 730" stroke="#3E2723" stroke-width="3" stroke-dasharray="15 5"/>
  </g>

  <!-- Vertical floor lines -->
  <g stroke="#3E2723" stroke-width="2" opacity="0.15">
    <line x1="200" y1="500" x2="180" y2="800"/>
    <line x1="600" y1="500" x2="590" y2="800"/>
    <line x1="1000" y1="500" x2="1020" y2="800"/>
  </g>

  <!-- Desk -->
  <rect x="200" y="380" width="800" height="30" rx="3" fill="#5D4037"/>
  <rect x="200" y="380" width="800" height="30" rx="3" fill="none" stroke="#8D6E63" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Desk legs -->
  <rect x="220" y="410" width="12" height="90" fill="#3E2723"/>
  <rect x="968" y="410" width="12" height="90" fill="#3E2723"/>
  <rect x="500" y="410" width="8" height="90" fill="#3E2723"/>
  <rect x="700" y="410" width="8" height="90" fill="#3E2723"/>

  <!-- Lamp glow overlay -->
  <rect width="1200" height="800" fill="url(#lampGlow)" pointer-events="none"/>

  <!-- Hanging lamp -->
  <path d="M600 0 L600 100" stroke="#3E2723" stroke-width="3"/>
  <path d="M570 100 L630 100 L640 130 L560 130 Z" fill="#BF360C"/>
  <path d="M570 100 L630 100 L640 130 L560 130 Z" fill="none" stroke="#E65100" stroke-width="2"/>
  <ellipse cx="600" cy="115" rx="12" ry="8" fill="#F4D03F" opacity="0.6"/>

  <!-- Open notebook/book on desk -->
  <g transform="translate(400, 320)">
    <path d="M0 60 Q50 50 100 60 L100 0 Q50 -10 0 0 Z" fill="#FFF8E1"/>
    <path d="M100 60 Q150 50 200 60 L200 0 Q150 -10 100 0 Z" fill="#FFFDE7"/>
    <path d="M0 60 Q50 50 100 60 L100 0 Q50 -10 0 0 Z" fill="none" stroke="#D4A017" stroke-width="2"/>
    <path d="M100 60 Q150 50 200 60 L200 0 Q150 -10 100 0 Z" fill="none" stroke="#D4A017" stroke-width="2"/>
    <!-- Spiral binding -->
    <g stroke="#8D6E63" stroke-width="2">
      <line x1="100" y1="0" x2="100" y2="60"/>
      <circle cx="100" cy="8" r="4" fill="none"/>
      <circle cx="100" cy="20" r="4" fill="none"/>
      <circle cx="100" cy="32" r="4" fill="none"/>
      <circle cx="100" cy="44" r="4" fill="none"/>
      <circle cx="100" cy="56" r="4" fill="none"/>
    </g>
    <!-- Writing lines -->
    <g stroke="#1A237E" stroke-width="1.5" opacity="0.3">
      <path d="M15 12 Q40 8 85 12" stroke-dasharray="4 2"/>
      <path d="M15 22 Q40 18 85 22" stroke-dasharray="4 2"/>
      <path d="M15 32 Q40 28 85 32" stroke-dasharray="4 2"/>
      <path d="M115 12 Q140 8 185 12" stroke-dasharray="4 2"/>
      <path d="M115 22 Q140 18 185 22" stroke-dasharray="4 2"/>
      <path d="M115 32 Q140 28 185 32" stroke-dasharray="4 2"/>
    </g>
  </g>

  <!-- Coffee cup -->
  <g transform="translate(660, 340)">
    <ellipse cx="40" cy="40" rx="35" ry="10" fill="#FFF8E1"/>
    <path d="M5 40 L12 0 L68 0 L75 40" fill="#E6B800" opacity="0.7"/>
    <path d="M5 40 L12 0 L68 0 L75 40" fill="none" stroke="#D4A017" stroke-width="2"/>
    <ellipse cx="40" cy="0" rx="28" ry="8" fill="#F4D03F" opacity="0.5"/>
    <!-- Handle -->
    <path d="M75 10 Q95 10 95 25 Q95 35 75 35" fill="none" stroke="#D4A017" stroke-width="3"/>
    <!-- Steam -->
    <g stroke="#F4D03F" stroke-width="2" stroke-linecap="round" opacity="0.3" fill="none">
      <path d="M30 -5 Q25 -15 30 -25" stroke-dasharray="3 3"/>
      <path d="M45 -3 Q50 -15 45 -25" stroke-dasharray="3 3"/>
    </g>
  </g>

  <!-- Stack of books left -->
  <g transform="translate(250, 340)">
    <rect x="0" y="20" width="100" height="15" rx="2" fill="#BF360C"/>
    <rect x="0" y="20" width="100" height="15" rx="2" fill="none" stroke="#E65100" stroke-width="1.5"/>
    <rect x="5" y="10" width="90" height="14" rx="2" fill="#1B4F72"/>
    <rect x="5" y="10" width="90" height="14" rx="2" fill="none" stroke="#2980B9" stroke-width="1.5"/>
    <rect x="10" y="0" width="80" height="12" rx="2" fill="#2E7D32"/>
    <rect x="10" y="0" width="80" height="12" rx="2" fill="none" stroke="#4CAF50" stroke-width="1.5"/>
  </g>

  <!-- Pen/inkwell -->
  <g transform="translate(620, 340)">
    <rect x="10" y="10" width="15" height="20" rx="3" fill="#1A237E"/>
    <ellipse cx="17.5" cy="10" rx="8" ry="4" fill="#283747"/>
    <line x1="22" y1="10" x2="28" y2="-15" stroke="#3E2723" stroke-width="2"/>
    <line x1="28" y1="-15" x2="32" y2="-12" stroke="#3E2723" stroke-width="1.5"/>
  </g>

  <!-- Window on wall -->
  <g transform="translate(850, 120)">
    <rect x="-5" y="-5" width="170" height="240" rx="3" fill="#1A237E" stroke="#5D4037" stroke-width="6"/>
    <!-- Window cross -->
    <line x1="80" y1="0" x2="80" y2="230" stroke="#5D4037" stroke-width="6"/>
    <line x1="0" y1="120" x2="160" y2="120" stroke="#5D4037" stroke-width="6"/>
    <!-- Stars visible through window -->
    <circle cx="30" cy="30" r="4" fill="#F4D03F" opacity="0.7"/>
    <circle cx="120" cy="50" r="3" fill="#F4D03F" opacity="0.5"/>
    <circle cx="50" cy="80" r="3" fill="#F4D03F" opacity="0.6"/>
    <circle cx="130" cy="180" r="4" fill="#F4D03F" opacity="0.7"/>
    <circle cx="40" cy="170" r="2" fill="#F4D03F" opacity="0.5"/>
    <!-- Curtain -->
    <path d="M0 0 L30 0 L30 230 L0 230" fill="#BF360C" opacity="0.5"/>
    <path d="M130 0 L160 0 L160 230 L130 230" fill="#BF360C" opacity="0.5"/>
    <path d="M30 10 L30 230" stroke="#D4A017" stroke-width="2" stroke-dasharray="4 6" opacity="0.3"/>
    <path d="M130 10 L130 230" stroke="#D4A017" stroke-width="2" stroke-dasharray="4 6" opacity="0.3"/>
  </g>

  <!-- Chair -->
  <g transform="translate(180, 440)">
    <rect x="0" y="0" width="10" height="60" fill="#5D4037"/>
    <rect x="70" y="0" width="10" height="60" fill="#5D4037"/>
    <rect x="0" y="0" width="80" height="8" fill="#8D6E63"/>
    <rect x="0" y="8" width="80" height="60" fill="none" stroke="#5D4037" stroke-width="3"/>
    <!-- Chair back -->
    <rect x="0" y="-40" width="80" height="40" rx="3" fill="#5D4037" opacity="0.8"/>
    <rect x="0" y="-40" width="80" height="40" rx="3" fill="none" stroke="#8D6E63" stroke-width="2"/>
  </g>

  <!-- Decorative picture/painting on wall -->
  <g transform="translate(340, 150)">
    <rect x="0" y="0" width="140" height="100" fill="#1B4F72" stroke="#5D4037" stroke-width="5"/>
    <!-- Mini landscape inside picture -->
    <path d="M0 60 Q35 30 70 50 Q105 70 140 40 L140 100 L0 100 Z" fill="#2E7D32" opacity="0.6"/>
    <circle cx="110" cy="25" r="12" fill="#F4D03F" opacity="0.5"/>
    <path d="M0 70 Q70 50 140 75" stroke="#4CAF50" stroke-width="3" stroke-dasharray="5 4" opacity="0.4"/>
    <path d="M20 80 Q70 65 120 85" stroke="#388E3C" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
  </g>

  <!-- Foreground brushstroke texture on floor -->
  <g stroke-linecap="round" fill="none" opacity="0.12">
    <path d="M0 550 C200 530 400 560 600 540 C800 520 1000 550 1200 530" stroke="#F4D03F" stroke-width="4" stroke-dasharray="8 5"/>
    <path d="M0 600 C200 580 400 610 600 590 C800 570 1000 600 1200 580" stroke="#F4D03F" stroke-width="3" stroke-dasharray="6 4"/>
  </g>

  <!-- Bottom text -->
  <text x="600" y="760" fill="#F4D03F" font-family="serif" font-size="24" font-style="italic" text-anchor="middle" letter-spacing="6" opacity="0.6">CHROCHET BLOG</text>
</svg>
