services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: jyoti-portfolio:latest
    container_name: jyoti-portfolio
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
