<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="invTitle invDesc">
  <title id="invTitle">Inventory Management — Modern Architecture</title>
  <desc id="invDesc">Abstract architectural and modular grid representation of multi-tenant inventory SaaS platform.</desc>
  <defs>
    <linearGradient id="invBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C25E38"/>
      <stop offset="100%" stop-color="#E27D60"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#invBg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="550" y1="0" x2="550" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="850" y1="0" x2="850" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
  </g>

  <!-- Glowing metric dashboard panels -->
  <rect x="140" y="160" width="920" height="480" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="140" y="160" width="920" height="64" rx="16" fill="#0F172A" opacity="0.8"/>
  <circle cx="180" cy="192" r="7" fill="#EF4444"/>
  <circle cx="204" cy="192" r="7" fill="#F59E0B"/>
  <circle cx="228" cy="192" r="7" fill="#10B981"/>
  <rect x="280" y="184" width="220" height="16" rx="8" fill="#334155"/>
  <rect x="860" y="184" width="160" height="16" rx="8" fill="#334155"/>

  <!-- Left Sidebar / Multi-tenant badges -->
  <rect x="180" y="260" width="200" height="340" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="204" y="285" width="150" height="14" rx="6" fill="url(#warmGrad)"/>
  <rect x="204" y="320" width="130" height="10" rx="5" fill="#475569"/>
  <rect x="204" y="344" width="110" height="10" rx="5" fill="#475569"/>
  <rect x="204" y="368" width="140" height="10" rx="5" fill="#475569"/>
  
  <rect x="204" y="415" width="150" height="1" fill="#334155"/>
  
  <rect x="204" y="440" width="120" height="12" rx="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="204" y="470" width="150" height="10" rx="5" fill="#475569"/>
  <rect x="204" y="494" width="135" height="10" rx="5" fill="#475569"/>
  <rect x="204" y="518" width="100" height="10" rx="5" fill="#475569"/>

  <!-- Right Dashboard Metrics -->
  <rect x="410" y="260" width="200" height="100" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="430" y="282" width="90" height="10" rx="5" fill="#94A3B8"/>
  <rect x="430" y="306" width="130" height="24" rx="6" fill="url(#accentGrad)"/>

  <rect x="635" y="260" width="200" height="100" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="655" y="282" width="100" height="10" rx="5" fill="#94A3B8"/>
  <rect x="655" y="306" width="120" height="24" rx="6" fill="url(#warmGrad)"/>

  <rect x="860" y="260" width="160" height="100" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="880" y="282" width="70" height="10" rx="5" fill="#94A3B8"/>
  <rect x="880" y="306" width="100" height="24" rx="6" fill="#10B981"/>

  <!-- Data Table Mockup -->
  <rect x="410" y="385" width="610" height="215" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  
  <rect x="430" y="410" width="570" height="24" rx="6" fill="#1E293B"/>
  <rect x="430" y="446" width="570" height="36" rx="6" fill="#1E293B" opacity="0.5"/>
  <rect x="445" y="458" width="140" height="12" rx="6" fill="#F1F5F9"/>
  <rect x="620" y="458" width="80" height="12" rx="6" fill="#38BDF8"/>
  <rect x="740" y="458" width="110" height="12" rx="6" fill="#94A3B8"/>
  <rect x="890" y="458" width="70" height="16" rx="8" fill="#10B981" opacity="0.3"/>

  <rect x="430" y="492" width="570" height="36" rx="6" fill="#1E293B" opacity="0.5"/>
  <rect x="445" y="504" width="160" height="12" rx="6" fill="#F1F5F9"/>
  <rect x="620" y="504" width="90" height="12" rx="6" fill="#38BDF8"/>
  <rect x="740" y="504" width="95" height="12" rx="6" fill="#94A3B8"/>
  <rect x="890" y="504" width="70" height="16" rx="8" fill="#F59E0B" opacity="0.3"/>

  <rect x="430" y="538" width="570" height="36" rx="6" fill="#1E293B" opacity="0.5"/>
  <rect x="445" y="550" width="125" height="12" rx="6" fill="#F1F5F9"/>
  <rect x="620" y="550" width="70" height="12" rx="6" fill="#38BDF8"/>
  <rect x="740" y="550" width="120" height="12" rx="6" fill="#94A3B8"/>
  <rect x="890" y="550" width="70" height="16" rx="8" fill="#10B981" opacity="0.3"/>
</svg>
